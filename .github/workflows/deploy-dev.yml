name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

# Secrets must be declared at job level. None are required — the build
# always succeeds (envs are stubbed during `next build`). A missing
# runtime secret just degrades that feature (e.g. sign-in without
# GITHUB_ID/GITHUB_SECRET).
#
# To create: Settings -> Secrets and variables -> Actions -> New
# repository secret. Copy the names from .github/secrets.example.txt.
env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
  GITHUB_ID: ${{ secrets.GITHUB_ID }}
  GITHUB_SECRET: ${{ secrets.GITHUB_SECRET }}
  SHADOW_DATABASE_URL: ${{ secrets.SHADOW_DATABASE_URL }}

jobs:
  build-and-serve:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t neuralnexus:dev .

      - name: Kill previous container
        run: |
          docker rm -f neuralnexus || true

      - name: Run
        run: |
          docker run -d \
            --name neuralnexus \
            --restart unless-stopped \
            --network host \
            -e NEXT_TELEMETRY_DISABLED=1 \
            -e DATABASE_URL="${DATABASE_URL}" \
            -e NEXTAUTH_SECRET="${NEXTAUTH_SECRET}" \
            -e GITHUB_ID="${GITHUB_ID}" \
            -e GITHUB_SECRET="${GITHUB_SECRET}" \
            -e SHADOW_DATABASE_URL="${SHADOW_DATABASE_URL}" \
            neuralnexus:dev
          docker logs --tail 30 neuralnexus

      - name: Health check
        run: |
          for i in $(seq 1 90); do
            if docker inspect -f '{{.State.Running}}' neuralnexus 2>/dev/null | grep -q true \
               && curl -fsSL http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "--- container state ---"
          docker inspect -f '{{.State.Status}} {{.State.Error}}' neuralnexus || true
          echo "--- container logs ---"
          docker logs --tail 200 neuralnexus || true
          exit 1
