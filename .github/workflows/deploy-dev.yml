name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

# Secrets: none are *required* for the build (NextAuth envs are stubbed
# during `next build`). Missing a runtime secret degrades that feature
# (sign-in won't work without GITHUB_ID/GITHUB_SECRET/NEXTAUTH_SECRET).
#
# To create: Settings -> Secrets and variables -> Actions -> repository
# secrets. Names: see .github/secrets.example.txt.
env:
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
  GITHUB_ID: ${{ secrets.GITHUB_ID }}
  GITHUB_SECRET: ${{ secrets.GITHUB_SECRET }}

jobs:
  build-and-serve:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t neuralnexus:dev .

      - name: Kill previous container
        run: |
          docker rm -f neuralnexus || true

      - name: Ensure SQLite data volume exists
        # Named volume created on first use; keeps the SQLite file
        # across container rebuilds. Bind-mounts are fine too.
        run: |
          docker volume inspect nn-sqlite >/dev/null 2>&1 \
            || docker volume create nn-sqlite

      - name: Run
        run: |
          docker run -d \
            --name neuralnexus \
            --restart unless-stopped \
            --network host \
            -e NEXT_TELEMETRY_DISABLED=1 \
            -e DATABASE_URL="file:/data/dev.db" \
            -e NEXTAUTH_SECRET="${NEXTAUTH_SECRET}" \
            -e GITHUB_ID="${GITHUB_ID}" \
            -e GITHUB_SECRET="${GITHUB_SECRET}" \
            -v nn-sqlite:/data \
            neuralnexus:dev
          docker logs --tail 30 neuralnexus

      - name: Health check
        run: |
          for i in $(seq 1 90); do
            if docker inspect -f '{{.State.Running}}' neuralnexus 2>/dev/null | grep -q true \
               && curl -fsSL http://127.0.0.1:3000/ >/dev/null 2>&1; then
              echo "web: healthy"
              # Verify the SQLite schema is queryable inside the container.
              db_check=$(cat <<'NODE'
              const {PrismaClient}=require("@prisma/client");
              const p=new PrismaClient({datasources:{db:{url:"file:/data/dev.db"}}});
              p.\$queryRaw("select count(1) as n from sqlite_master where type='table'")
               .then(r=>{console.log("sqlite tables:",r[0].n);return p.\$disconnect()})
               .catch(e=>{console.error("db failed:",e.message);process.exit(1)});
              NODE
              )
              printf '%s\n' "$db_check" | docker exec -i neuralnexus node
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          echo "--- container state ---"
          docker inspect -f '{{.State.Status}} {{.State.Error}}' neuralnexus || true
          echo "--- container logs ---"
          docker logs --tail 200 neuralnexus || true
          exit 1
